  <text x="420" y="318" font-family="Arial" font-size="15" fill="#334155">metadata-aware ingestion</text>
  <text x="420" y="344" font-family="Arial" font-size="15" fill="#334155">minimal normalization</text>

  <rect x="660" y="205" rx="16" width="210" height="170" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
