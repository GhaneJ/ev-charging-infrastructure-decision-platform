  <text x="690" y="292" font-family="Arial" font-size="15" fill="#334155">typed analytical tables</text>
  <text x="690" y="318" font-family="Arial" font-size="15" fill="#334155">business keys + dedupe</text>
  <text x="690" y="344" font-family="Arial" font-size="15" fill="#334155">grain preserved</text>

  <rect x="930" y="205" rx="16" width="210" height="170" fill="#fff8dc" stroke="#ca8a04" stroke-width="2"/>
