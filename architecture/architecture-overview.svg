  <line x1="300" y1="290" x2="390" y2="290" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="290" x2="660" y2="290" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="870" y1="290" x2="930" y2="290" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
