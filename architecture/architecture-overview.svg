  <text x="1198" y="292" font-family="Arial" font-size="14" fill="#334155">decision views</text>
  <text x="1198" y="318" font-family="Arial" font-size="14" fill="#334155">snapshot comparison</text>
  <text x="1198" y="344" font-family="Arial" font-size="14" fill="#334155">ranking movement</text>

