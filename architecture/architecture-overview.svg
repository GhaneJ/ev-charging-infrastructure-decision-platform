  <text x="420" y="640" font-family="Arial" font-size="15" fill="#475569">schedule · dependency order · Bronze retries · monitoring · failure routing · Logic App alerting</text>

  <!-- ADF orchestration arrows -->
  <line x1="540" y1="575" x2="500" y2="378" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#dasharrow)"/>
  <line x1="765" y1="575" x2="765" y2="378" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#dasharrow)"/>
  <line x1="990" y1="575" x2="1035" y2="378" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#dasharrow)"/>
</svg>