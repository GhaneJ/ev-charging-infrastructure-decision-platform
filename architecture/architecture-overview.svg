      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="dasharrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="70" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a">EV Charging Infrastructure Decision Platform</text>
  <text x="70" y="98" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Public APIs → governed Delta layers → transparent municipal ranking → Power BI</text>

  <!-- Sources -->
  <rect x="70" y="180" rx="16" ry="16" width="230" height="260" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
