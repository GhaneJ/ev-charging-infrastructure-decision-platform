  <text x="100" y="262" font-family="Arial" font-size="16" fill="#334155">SCB tab3277</text>
  <text x="100" y="286" font-family="Arial" font-size="14" fill="#64748b">new vehicle registrations</text>
  <text x="100" y="330" font-family="Arial" font-size="16" fill="#334155">SCB tab1278 + tab5557</text>
  <text x="100" y="354" font-family="Arial" font-size="14" fill="#64748b">passenger cars + population</text>
  <text x="100" y="398" font-family="Arial" font-size="16" fill="#334155">Elpriset just nu</text>
  <text x="100" y="422" font-family="Arial" font-size="14" fill="#64748b">SE1–SE4 electricity prices</text>

