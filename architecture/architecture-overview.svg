  <text x="960" y="318" font-family="Arial" font-size="15" fill="#334155">transparent scoring</text>
  <text x="960" y="344" font-family="Arial" font-size="15" fill="#334155">Top 50 candidates</text>

  <rect x="1175" y="205" rx="16" width="185" height="170" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
